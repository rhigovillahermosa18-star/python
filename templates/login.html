<!DOCTYPE html>
<html>
<head>
<title>Login - Vape Inventory</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
.login-card{background:rgba(255,255,255,0.95);border:none;border-radius:25px;box-shadow:0 30px 80px rgba(0,0,0,0.3);backdrop-filter:blur(10px);overflow:hidden;}
.login-header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:40px;text-align:center;}
.login-header i{font-size:3rem;margin-bottom:15px;}
.login-header h3{font-weight:700;margin:0;}
.login-body{padding:40px;}
.form-control{border-radius:12px;padding:12px 20px;border:2px solid #e0e0e0;transition:all 0.3s;}
.form-control:focus{border-color:#667eea;box-shadow:0 0 0 0.2rem rgba(102,126,234,0.25);}
.input-group-text{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px 0 0 12px;}
.btn-login{background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:12px;padding:12px;font-weight:600;color:#fff;transition:all 0.3s;}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(102,126,234,0.4);color:#fff;}
.alert{border-radius:12px;border:none;}
</style>
</head>
<body>
<div class="container">
<div class="row justify-content-center">
<div class="col-md-5">
<div class="login-card">
<div class="login-header">
<i class="fas fa-smoking"></i>
<h3>Vape Inventory</h3>
<p class="mb-0">Admin Login</p>
</div>
<div class="login-body">
{% if error %}
<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> {{error}}</div>
{% endif %}
<form method="POST">
<div class="mb-3">
<div class="input-group">
<span class="input-group-text"><i class="fas fa-user"></i></span>
<input type="text" name="username" class="form-control" placeholder="Username" required>
</div>
</div>
<div class="mb-4">
<div class="input-group">
<span class="input-group-text"><i class="fas fa-lock"></i></span>
<input type="password" name="password" class="form-control" placeholder="Password" required>
</div>
</div>
<button class="btn btn-login w-100"><i class="fas fa-sign-in-alt"></i> Login</button>
</form>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
