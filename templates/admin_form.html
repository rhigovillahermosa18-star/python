{% extends "layout.html" %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-7">
<div class="card-dark p-5">
  <h2 class="section-title mb-4">
    <i class="fas fa-{% if item %}edit{% else %}plus-circle{% endif %}"></i>
    {% if item %}Edit{% else %}Add{% endif %} Product
  </h2>
  <form method="POST">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label style="color:#aaa;font-size:0.9rem"><i class="fas fa-tag"></i> Name</label>
        <input type="text" name="name" class="form-control" value="{% if item %}{{item.name}}{% endif %}" placeholder="Product name" required>
      </div>
      <div class="col-md-6 mb-3">
        <label style="color:#aaa;font-size:0.9rem"><i class="fas fa-lemon"></i> Flavor</label>
        <input type="text" name="flavor" class="form-control" value="{% if item %}{{item.flavor}}{% endif %}" placeholder="e.g. Mango" required>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label style="color:#aaa;font-size:0.9rem"><i class="fas fa-flask"></i> Nicotine (mg)</label>
        <input type="number" name="nicotine" class="form-control" value="{% if item %}{{item.nicotine}}{% endif %}" placeholder="0" required>
      </div>
      <div class="col-md-4 mb-3">
        <label style="color:#aaa;font-size:0.9rem"><i class="fas fa-fill-drip"></i> Size (ml)</label>
        <input type="number" name="size" class="form-control" value="{% if item %}{{item.size}}{% endif %}" placeholder="0" required>
      </div>
      <div class="col-md-4 mb-3">
        <label style="color:#aaa;font-size:0.9rem"><i class="fas fa-cubes"></i> Stock</label>
        <input type="number" name="stock" class="form-control" value="{% if item %}{{item.stock}}{% endif %}" placeholder="0" required>
      </div>
    </div>
    <div class="mb-4">
      <label style="color:#aaa;font-size:0.9rem"><i class="fas fa-peso-sign"></i> Price (₱)</label>
      <input type="number" name="price" class="form-control" value="{% if item %}{{item.price}}{% endif %}" placeholder="0.00" step="0.01" required>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-purple px-4"><i class="fas fa-{% if item %}check{% else %}save{% endif %}"></i> {% if item %}Update{% else %}Save{% endif %} Product</button>
      <a href="/admin" class="btn btn-outline-purple px-4"><i class="fas fa-arrow-left"></i> Cancel</a>
    </div>
  </form>
</div>
</div>
</div>

{% endblock %}
