<!DOCTYPE html>
<html>
<head>
<title>Vape Inventory</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
.navbar{background:rgba(255,255,255,0.1)!important;backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.1);}
.navbar-brand{color:#fff!important;font-size:1.5rem;font-weight:700;letter-spacing:1px;}
.btn-glass{background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:#fff;backdrop-filter:blur(10px);transition:all 0.3s;}
.btn-glass:hover{background:rgba(255,255,255,0.3);color:#fff;transform:translateY(-2px);}
.btn-danger-glass{background:rgba(220,53,69,0.8);border:none;color:#fff;}
.btn-danger-glass:hover{background:rgba(220,53,69,1);color:#fff;}
.card{background:rgba(255,255,255,0.95);border:none;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);backdrop-filter:blur(10px);}
.table{background:#fff;border-radius:15px;overflow:hidden;}
.table thead{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.btn{border-radius:10px;padding:8px 20px;font-weight:600;transition:all 0.3s;}
.btn-success{background:linear-gradient(135deg,#11998e,#38ef7d);border:none;}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(56,239,125,0.4);}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);border:none;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(118,75,162,0.4);}
.btn-danger{background:linear-gradient(135deg,#eb3349,#f45c43);border:none;}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(235,51,73,0.4);}
.btn-sm{padding:5px 15px;font-size:0.875rem;}
</style>
</head>
<body>
<nav class="navbar navbar-dark">
<div class="container">
<a class="navbar-brand"><i class="fas fa-smoking"></i> Vape Inventory</a>
<div>
<a href="/" class="btn btn-glass btn-sm me-2"><i class="fas fa-home"></i> Home</a>
<a href="/logout" class="btn btn-danger-glass btn-sm"><i class="fas fa-sign-out-alt"></i> Logout</a>
</div>
</div>
</nav>
<div class="container mt-5">
{% block content %}
{% endblock %}
</div>
</body>
</html>
