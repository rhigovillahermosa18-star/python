{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
<div class="card p-5">
<h2 class="mb-4"><i class="fas fa-edit"></i> Edit Vape Juice</h2>
<form method="POST">
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label fw-bold"><i class="fas fa-tag"></i> Name</label>
<input type="text" name="name" value="{{item.name}}" class="form-control" required>
</div>
<div class="col-md-6 mb-3">
<label class="form-label fw-bold"><i class="fas fa-lemon"></i> Flavor</label>
<input type="text" name="flavor" value="{{item.flavor}}" class="form-control" required>
</div>
</div>
<div class="row">
<div class="col-md-4 mb-3">
<label class="form-label fw-bold"><i class="fas fa-flask"></i> Nicotine (mg)</label>
<input type="number" name="nicotine" value="{{item.nicotine}}" class="form-control" required>
</div>
<div class="col-md-4 mb-3">
<label class="form-label fw-bold"><i class="fas fa-fill-drip"></i> Size (ml)</label>
<input type="number" name="size" value="{{item.size}}" class="form-control" required>
</div>
<div class="col-md-4 mb-3">
<label class="form-label fw-bold"><i class="fas fa-peso-sign"></i> Price (₱)</label>
<input type="number" name="price" value="{{item.price}}" class="form-control" step="0.01" required>
</div>
</div>
<div class="d-flex gap-2 mt-3">
<button type="submit" class="btn btn-primary"><i class="fas fa-check-circle"></i> Update Product</button>
<a href="/" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Cancel</a>
</div>
</form>
</div>
</div>
</div>
{% endblock %}
