{% extends "layout.html" %}

{% block content %}

<div class="card p-4">

<h2>Edit Vape Juice</h2>

<form method="POST">

<div class="mb-3">
<label>Name</label>
<input type="text" name="name" value="{{item.name}}" class="form-control">
</div>

<div class="mb-3">
<label>Flavor</label>
<input type="text" name="flavor" value="{{item.flavor}}" class="form-control">
</div>

<div class="mb-3">
<label>Nicotine</label>
<input type="number" name="nicotine" value="{{item.nicotine}}" class="form-control">
</div>

<div class="mb-3">
<label>Size</label>
<input type="number" name="size" value="{{item.size}}" class="form-control">
</div>

<div class="mb-3">
<label>Price</label>
<input type="number" name="price" value="{{item.price}}" class="form-control">
</div>

<button class="btn btn-primary">Update</button>

</form>

</div>

{% endblock %}
