<!DOCTYPE html>
<html>
<head>
<title>Register - CloudVape</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0f0f1a;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;}
.auth-card{background:rgba(255,255,255,0.04);border:1px solid rgba(139,92,246,0.3);border-radius:24px;padding:50px 40px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
.brand{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:8px;}
.form-control{background:rgba(255,255,255,0.07);border:1px solid rgba(139,92,246,0.3);color:#e0e0e0;border-radius:10px;padding:12px 16px;}
.form-control:focus{background:rgba(255,255,255,0.1);border-color:#8b5cf6;box-shadow:0 0 0 0.2rem rgba(139,92,246,0.25);color:#fff;}
.form-control::placeholder{color:#666;}
.input-group-text{background:rgba(139,92,246,0.2);border:1px solid rgba(139,92,246,0.3);color:#8b5cf6;border-radius:10px 0 0 10px;}
.btn-purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed);border:none;color:#fff;border-radius:10px;font-weight:600;padding:12px;transition:all 0.3s;}
.btn-purple:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(139,92,246,0.4);color:#fff;}
.alert{border-radius:10px;border:none;}
.alert-danger{background:rgba(220,53,69,0.15);color:#f87171;border:1px solid rgba(220,53,69,0.3);}
label{color:#aaa;font-size:0.9rem;margin-bottom:6px;}
</style>
</head>
<body>
<div class="auth-card">
  <div class="brand"><i class="fas fa-cloud"></i> CloudVape</div>
  <p class="text-center mb-4" style="color:#888">Create your account to start shopping.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{cat}} mb-3">{{msg}}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label>Username</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-user"></i></span>
        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
      </div>
    </div>
    <div class="mb-3">
      <label>Email</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
      </div>
    </div>
    <div class="mb-4">
      <label>Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="Create a password" required>
      </div>
    </div>
    <div class="mb-4">
      <label>Phone Number</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-phone"></i></span>
        <input type="text" name="phone" class="form-control" placeholder="e.g. 09XX-XXX-XXXX" required>
      </div>
    </div>
    <div class="mb-4">
      <label>Delivery Address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
        <input type="text" name="address" class="form-control" placeholder="Street, Barangay, City, Province" required>
      </div>
    </div>
    <button class="btn btn-purple w-100 mb-3"><i class="fas fa-user-plus"></i> Create Account</button>
  </form>
  <p class="text-center mb-0" style="color:#888">Already have an account? <a href="/login" style="color:#8b5cf6;text-decoration:none;font-weight:600">Login</a></p>
  <p class="text-center mt-2"><a href="/" style="color:#666;font-size:0.85rem;text-decoration:none"><i class="fas fa-arrow-left"></i> Back to Home</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
