<!DOCTYPE html>
<html>
<head>
<title>Reset Password - CloudVape</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0f0f1a;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;}
.auth-card{background:rgba(255,255,255,0.04);border:1px solid rgba(139,92,246,0.3);border-radius:24px;padding:50px 40px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,0.5);}
.brand{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:8px;}
.form-control{background:rgba(255,255,255,0.07);border:1px solid rgba(139,92,246,0.3);color:#e0e0e0;border-radius:10px;padding:12px 16px;}
.form-control:focus{background:rgba(255,255,255,0.1);border-color:#8b5cf6;box-shadow:0 0 0 0.2rem rgba(139,92,246,0.25);color:#fff;}
.form-control::placeholder{color:#666;}
.input-group-text{background:rgba(139,92,246,0.2);border:1px solid rgba(139,92,246,0.3);color:#8b5cf6;border-radius:10px 0 0 10px;}
.btn-purple{background:linear-gradient(135deg,#8b5cf6,#7c3aed);border:none;color:#fff;border-radius:10px;font-weight:600;padding:12px;transition:all 0.3s;}
.btn-purple:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(139,92,246,0.4);color:#fff;}
.alert-success{background:rgba(56,239,125,0.15);color:#38ef7d;border:1px solid rgba(56,239,125,0.3);border-radius:10px;}
.alert-danger{background:rgba(220,53,69,0.15);color:#f87171;border:1px solid rgba(220,53,69,0.3);border-radius:10px;}
label{color:#aaa;font-size:0.9rem;margin-bottom:6px;}
</style>
</head>
<body>
<div class="auth-card">
  <div class="brand"><i class="fas fa-cloud"></i> CloudVape</div>
  <p class="text-center mb-4" style="color:#888">Enter the code sent to your email and set a new password.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{cat}} mb-3">{{msg}}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label>Reset Code</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-key"></i></span>
        <input type="text" name="code" class="form-control text-center" placeholder="Enter 6-digit code" maxlength="6" style="letter-spacing:6px;font-weight:700;font-size:1.2rem" required autofocus>
      </div>
    </div>
    <div class="mb-3">
      <label>New Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" name="password" id="newPass" class="form-control" placeholder="Enter new password" required>
        <span class="input-group-text" onclick="togglePass('newPass','newEye')" style="cursor:pointer;border-radius:0 10px 10px 0"><i class="fas fa-eye" id="newEye"></i></span>
      </div>
    </div>
    <div class="mb-4">
      <label>Confirm Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-lock"></i></span>
        <input type="password" name="confirm" id="confPass" class="form-control" placeholder="Confirm new password" required>
        <span class="input-group-text" onclick="togglePass('confPass','confEye')" style="cursor:pointer;border-radius:0 10px 10px 0"><i class="fas fa-eye" id="confEye"></i></span>
      </div>
    </div>
    <button class="btn btn-purple w-100 mb-3"><i class="fas fa-check-circle"></i> Reset Password</button>
  </form>
  <p class="text-center mt-2"><a href="/login" style="color:#666;font-size:0.85rem;text-decoration:none"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePass(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.replace('fa-eye', 'fa-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.replace('fa-eye-slash', 'fa-eye');
  }
}
</script>
</body>
</html>
