{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
<div class="card p-5">
<h2 class="mb-4"><i class="fas fa-plus-circle"></i> Add Vape Juice</h2>
<form method="POST">
<div class="row">
<div class="col-md-6 mb-3">
<label class="form-label fw-bold"><i class="fas fa-tag"></i> Name</label>
<input type="text" name="name" class="form-control" placeholder="Enter product name" required>
</div>
<div class="col-md-6 mb-3">
<label class="form-label fw-bold"><i class="fas fa-lemon"></i> Flavor</label>
<input type="text" name="flavor" class="form-control" placeholder="Enter flavor" required>
</div>
</div>
<div class="row">
<div class="col-md-4 mb-3">
<label class="form-label fw-bold"><i class="fas fa-flask"></i> Nicotine (mg)</label>
<input type="number" name="nicotine" class="form-control" placeholder="0" required>
</div>
<div class="col-md-4 mb-3">
<label class="form-label fw-bold"><i class="fas fa-fill-drip"></i> Size (ml)</label>
<input type="number" name="size" class="form-control" placeholder="0" required>
</div>
<div class="col-md-4 mb-3">
<label class="form-label fw-bold"><i class="fas fa-peso-sign"></i> Price (₱)</label>
<input type="number" name="price" class="form-control" placeholder="0.00" step="0.01" required>
</div>
</div>
<div class="d-flex gap-2 mt-3">
<button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Save Product</button>
<a href="/" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Cancel</a>
</div>
</form>
</div>
</div>
</div>
{% endblock %}
